<svg width="100%" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030812"/>
      <stop offset="30%" stop-color="#071028"/>
      <stop offset="50%" stop-color="#0c0920"/>
      <stop offset="70%" stop-color="#1a0b1a"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>
    <radialGradient id="lfog" cx="15%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.20"/><stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rfog" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FF2244" stop-opacity="0.20"/><stop offset="100%" stop-color="#FF2244" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cfog" cx="50%" cy="65%" r="28%">
      <stop offset="0%" stop-color="#FFAA00" stop-opacity="0.35"/><stop offset="50%" stop-color="#FF4400" stop-opacity="0.12"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="35%" stop-color="#3B82F6"/><stop offset="50%" stop-color="#FFF"/><stop offset="65%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FF2244"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E7FF"/><stop offset="40%" stop-color="#00F0FF"/><stop offset="60%" stop-color="#FFF"/><stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="gnd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bg2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b1"/><feGaussianBlur stdDeviation="2" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    @keyframes dashL{0%{stroke-dashoffset:300}100%{stroke-dashoffset:0}}
    @keyframes dashR{0%{stroke-dashoffset:-300}100%{stroke-dashoffset:0}}
    @keyframes flk{0%,100%{opacity:.15}20%{opacity:.95}22%{opacity:.3}70%{opacity:1}72%{opacity:.4}}
    @keyframes sw{0%{r:10;opacity:1;stroke-width:4}100%{r:70;opacity:0;stroke-width:.5}}
    @keyframes flash{0%,25%,100%{opacity:0}10%,15%{opacity:1}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes sparks{0%,100%{opacity:.3}25%{opacity:1}50%{opacity:.4}75%{opacity:1}}
    .laserL{stroke-dasharray:30 12;animation:dashL .9s linear infinite}
    .laserR{stroke-dasharray:30 12;animation:dashR .9s linear infinite}
    .laserH{stroke-dasharray:50 25;animation:dashL .6s linear infinite}
    .zap{animation:flk 1.6s ease-in-out infinite}
    .mzl{animation:flash 1.6s ease-in-out infinite}
    .pls{animation:pulse 2s ease-in-out infinite}
    .spk{animation:sparks 1.2s ease-in-out infinite}
    .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'Fira Code',Consolas,Monaco,monospace}
  </style>

  <!-- BG layers -->
  <rect width="960" height="420" rx="16" fill="url(#bg)"/>
  <rect width="960" height="420" rx="16" fill="url(#grid)"/>
  <rect width="960" height="420" rx="16" fill="url(#lfog)"/>
  <rect width="960" height="420" rx="16" fill="url(#rfog)"/>
  <rect width="960" height="420" rx="16" fill="url(#cfog)"/>
  <rect x="0" y="350" width="960" height="70" fill="url(#gnd)"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#1e293b" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
  <rect x="0" y="0" width="960" height="3" fill="url(#stripe)"/>

  <!-- === TOP: NAME AND TITLE === -->
  <g text-anchor="middle">
    <rect x="210" y="8" width="540" height="20" rx="10" fill="#080c1a" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="480" y="21" class="f" font-size="10" font-weight="800" letter-spacing="2">
      <tspan fill="#00F0FF">⚔ STATIC CITADEL</tspan>
      <tspan fill="#64748B">  ── COMPILER WARFARE ──  </tspan>
      <tspan fill="#FF3366">DYNAMIC SWARM 🔥</tspan>
    </text>
  </g>
  <text x="480" y="58" text-anchor="middle" class="f" font-size="38" font-weight="900" letter-spacing="5" fill="url(#nameG)">SIJAZ AHMED</text>
  <rect x="305" y="65" width="350" height="20" rx="10" fill="rgba(0,240,255,0.06)" stroke="rgba(0,240,255,0.25)" stroke-width="1"/>
  <text x="480" y="78" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="2">SENIOR AI/ML ARCHITECT • FULL STACK LEAD</text>
  <text x="480" y="96" text-anchor="middle" class="m" font-size="9" fill="#64748B" letter-spacing="1">ENTERPRISE LLMs &amp; RAG • REAL-TIME STREAMING • MULTI-CLOUD</text>

  <!-- ==================== LEFT ARMY: STATIC CITADEL ==================== -->

  <!-- 🦀 RUST CRAB BATTLE MECH — far left, Y=200 -->
  <!-- Armored crab shell -->
  <ellipse cx="75" cy="200" rx="34" ry="22" fill="#0d2040" stroke="#00F0FF" stroke-width="2"/>
  <path d="M45 192Q43 176 57 172L93 172Q107 176 105 192" fill="#0a1a35" stroke="#00F0FF" stroke-width="1.5"/>
  <!-- Left claw -->
  <path d="M45 196L23 180L31 172L17 166" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 166L25 160M17 166L11 172" fill="none" stroke="#FF5722" stroke-width="2.5"/>
  <!-- Right claw -->
  <path d="M105 196L127 180L119 172L133 166" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>
  <path d="M133 166L125 160M133 166L139 172" fill="none" stroke="#FF5722" stroke-width="2.5"/>
  <!-- Glowing eyes -->
  <circle cx="65" cy="192" r="4" fill="#00F0FF" filter="url(#g)"/>
  <circle cx="85" cy="192" r="4" fill="#00F0FF" filter="url(#g)"/>
  <!-- Tank treads -->
  <rect x="41" y="214" width="24" height="9" rx="3" fill="#1e293b" stroke="#00F0FF" stroke-width="1"/>
  <rect x="85" y="214" width="24" height="9" rx="3" fill="#1e293b" stroke="#00F0FF" stroke-width="1"/>
  <!-- Main cannon -->
  <rect x="107" y="196" width="24" height="8" rx="2" fill="#00F0FF" filter="url(#g)"/>
  <!-- Muzzle flash -->
  <circle cx="135" cy="200" r="9" fill="#FFF" class="mzl" filter="url(#bg2)"/>
  <text x="75" y="240" text-anchor="middle" fill="#00F0FF" class="m" font-size="9" font-weight="700">🦀 RUST MECH</text>

  <!-- ⚔ C++ SIEGE TANK — lower-left, Y=305 -->
  <!-- Heavy body -->
  <rect x="55" y="291" width="80" height="28" rx="5" fill="#0a1830" stroke="#38BDF8" stroke-width="2"/>
  <!-- Turret -->
  <rect x="75" y="279" width="40" height="16" rx="3" fill="#12243e" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Dual cannons -->
  <rect x="115" y="281" width="42" height="7" rx="2" fill="#38BDF8" filter="url(#g)"/>
  <rect x="115" y="291" width="30" height="5" rx="1" fill="#64748b"/>
  <!-- Treads -->
  <rect x="51" y="319" width="88" height="11" rx="4" fill="#1e293b" stroke="#38BDF8" stroke-width="1"/>
  <line x1="57" y1="319" x2="57" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="67" y1="319" x2="67" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="77" y1="319" x2="77" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="87" y1="319" x2="87" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="97" y1="319" x2="97" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="107" y1="319" x2="107" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="117" y1="319" x2="117" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <line x1="127" y1="319" x2="127" y2="330" stroke="#38BDF8" stroke-width="0.7" opacity="0.4"/>
  <!-- Scope -->
  <circle cx="67" cy="287" r="4" fill="none" stroke="#38BDF8" stroke-width="1"/>
  <line x1="67" y1="283" x2="67" y2="291" stroke="#38BDF8" stroke-width="0.7"/>
  <line x1="63" y1="287" x2="71" y2="287" stroke="#38BDF8" stroke-width="0.7"/>
  <!-- Muzzle blast -->
  <circle cx="161" cy="285" r="11" fill="#FFF" class="mzl" filter="url(#bg2)"/>
  <text x="95" y="348" text-anchor="middle" fill="#38BDF8" class="m" font-size="9" font-weight="700">⚔ C++ SIEGE TANK</text>

  <!-- ⚡ GO GOPHER MECH — mid-left, Y=200 -->
  <!-- Armored gopher body -->
  <circle cx="230" cy="200" r="24" fill="#0E7490" stroke="#22D3EE" stroke-width="2"/>
  <!-- Goggle eyes -->
  <ellipse cx="221" cy="195" rx="9" ry="8" fill="#FFF" stroke="#22D3EE" stroke-width="1"/>
  <ellipse cx="239" cy="195" rx="9" ry="8" fill="#FFF" stroke="#22D3EE" stroke-width="1"/>
  <circle cx="223" cy="195" r="4" fill="#0f172a"/>
  <circle cx="241" cy="195" r="4" fill="#0f172a"/>
  <!-- Antenna ears -->
  <line x1="214" y1="180" x2="210" y2="164" stroke="#22D3EE" stroke-width="2"/>
  <circle cx="210" cy="162" r="3" fill="#22D3EE" filter="url(#g)" class="pls"/>
  <line x1="246" y1="180" x2="250" y2="164" stroke="#22D3EE" stroke-width="2"/>
  <circle cx="250" cy="162" r="3" fill="#22D3EE" filter="url(#g)" class="pls"/>
  <!-- Jetpack flames (using animate for flicker) -->
  <path d="M220 220L216 234Q220 240 224 232Z" fill="#F59E0B" opacity="0.9" class="pls"/>
  <path d="M236 220L232 234Q236 240 240 232Z" fill="#F59E0B" opacity="0.9" class="pls"/>
  <!-- Arm blasters -->
  <rect x="254" y="194" width="20" height="9" rx="2" fill="#22D3EE" filter="url(#g)"/>
  <rect x="186" y="194" width="20" height="9" rx="2" fill="#22D3EE" filter="url(#g)"/>
  <text x="230" y="252" text-anchor="middle" fill="#22D3EE" class="m" font-size="9" font-weight="700">⚡ GO MECH</text>

  <!-- 🔷 TYPESCRIPT STEALTH DRONE — upper-left, Y=130 -->
  <!-- Diamond body -->
  <polygon points="220,108 246,130 220,152 194,130" fill="#1e3a8a" stroke="#60A5FA" stroke-width="2"/>
  <polygon points="220,119 233,130 220,141 207,130" fill="#2563eb" stroke="#93C5FD" stroke-width="1"/>
  <!-- Wing blades -->
  <line x1="194" y1="130" x2="176" y2="120" stroke="#60A5FA" stroke-width="2"/>
  <line x1="246" y1="130" x2="264" y2="120" stroke="#60A5FA" stroke-width="2"/>
  <!-- Rotor glow (pulsing circles instead of spinning) -->
  <circle cx="176" cy="120" r="7" fill="none" stroke="#60A5FA" stroke-width="1.5" class="pls"/>
  <circle cx="264" cy="120" r="7" fill="none" stroke="#60A5FA" stroke-width="1.5" class="pls"/>
  <!-- Targeting core -->
  <circle cx="220" cy="130" r="3" fill="#FFF" filter="url(#g)"/>
  <text x="220" y="168" text-anchor="middle" fill="#60A5FA" class="m" font-size="9" font-weight="700">🔷 TS DRONE</text>


  <!-- ==================== RIGHT ARMY: DYNAMIC SWARM ==================== -->

  <!-- 🐍 PYTHON SERPENT DRAGON — far right, Y=200 -->
  <!-- Serpent S-curve body -->
  <path d="M920 205Q905 185 885 190Q865 200 850 185Q835 170 830 190Q827 208 840 215Q855 222 870 210Q890 195 910 208" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="920" cy="205" r="14" fill="#065F46" stroke="#10B981" stroke-width="2"/>
  <!-- Fiery eyes -->
  <circle cx="925" cy="200" r="3" fill="#FBBF24" filter="url(#g)"/>
  <circle cx="917" cy="198" r="2.5" fill="#10B981" filter="url(#g)"/>
  <!-- Fangs -->
  <line x1="929" y1="208" x2="933" y2="217" stroke="#FFF" stroke-width="2"/>
  <line x1="923" y1="210" x2="925" y2="219" stroke="#FFF" stroke-width="1.5"/>
  <!-- Dragon horns -->
  <line x1="915" y1="192" x2="909" y2="178" stroke="#FBBF24" stroke-width="2"/>
  <line x1="923" y1="190" x2="921" y2="176" stroke="#FBBF24" stroke-width="2"/>
  <!-- PyTorch flame orbs -->
  <circle cx="835" cy="172" r="5" fill="#EE4C2C" filter="url(#g)" class="pls"/>
  <circle cx="895" cy="175" r="4" fill="#EE4C2C" filter="url(#g)" class="pls"/>
  <!-- Fire breath (flickers) -->
  <path d="M933 206L945 198L940 208L953 204L945 214L937 210Z" fill="#FBBF24" filter="url(#g)" class="pls"/>
  <text x="885" y="240" text-anchor="middle" fill="#10B981" class="m" font-size="9" font-weight="700">🐍 PYTHON DRAGON</text>

  <!-- ⚡ JS EVENT LOOP CHAOS MECH — lower right, Y=305 -->
  <!-- Mech body -->
  <rect x="839" y="287" width="52" height="36" rx="6" fill="#422006" stroke="#FACC15" stroke-width="2"/>
  <!-- Event loop orbital rings (static with pulsing opacity) -->
  <ellipse cx="865" cy="305" rx="40" ry="14" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.7" class="pls"/>
  <ellipse cx="865" cy="305" rx="14" ry="40" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5" class="pls"/>
  <!-- Face -->
  <text x="865" y="311" text-anchor="middle" fill="#FACC15" class="m" font-size="16" font-weight="900">JS</text>
  <!-- Jester hat tips -->
  <path d="M845 287L835 269L843 277" fill="none" stroke="#FACC15" stroke-width="2"/>
  <circle cx="835" cy="269" r="3" fill="#FACC15" filter="url(#g)"/>
  <path d="M885 287L895 269L887 277" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="895" cy="269" r="3" fill="#F59E0B" filter="url(#g)"/>
  <!-- Arm cannons -->
  <rect x="817" y="299" width="22" height="10" rx="3" fill="#FACC15" filter="url(#g)"/>
  <rect x="891" y="299" width="22" height="10" rx="3" fill="#FACC15" filter="url(#g)"/>
  <!-- Muzzle flash -->
  <circle cx="813" cy="304" r="9" fill="#FFF" class="mzl" filter="url(#bg2)"/>
  <!-- Treads -->
  <rect x="835" y="323" width="20" height="8" rx="3" fill="#1e293b" stroke="#FACC15" stroke-width="1"/>
  <rect x="875" y="323" width="20" height="8" rx="3" fill="#1e293b" stroke="#FACC15" stroke-width="1"/>
  <text x="865" y="348" text-anchor="middle" fill="#FACC15" class="m" font-size="9" font-weight="700">⚡ JS CHAOS MECH</text>

  <!-- 🔥 PYTORCH FLAME ARTILLERY — mid-right, Y=295 -->
  <!-- Artillery base -->
  <rect x="698" y="295" width="64" height="22" rx="4" fill="#2a0a0a" stroke="#FF2E55" stroke-width="1.8"/>
  <!-- Gun platform turret -->
  <rect x="714" y="273" width="32" height="24" rx="3" fill="#3a0f0f" stroke="#FF2E55" stroke-width="1.5"/>
  <!-- Angled cannon barrel -->
  <line x1="714" y1="273" x2="678" y2="241" stroke="#FF2E55" stroke-width="6" stroke-linecap="round"/>
  <!-- Muzzle fire -->
  <circle cx="675" cy="238" r="11" fill="#FF5500" class="mzl" filter="url(#bg2)"/>
  <circle cx="672" cy="235" r="6" fill="#FFF" class="mzl" filter="url(#bg2)"/>
  <!-- Wheels -->
  <circle cx="706" cy="319" r="8" fill="#1e293b" stroke="#FF2E55" stroke-width="1.5"/>
  <circle cx="754" cy="319" r="8" fill="#1e293b" stroke="#FF2E55" stroke-width="1.5"/>
  <line x1="706" y1="311" x2="706" y2="327" stroke="#FF2E55" stroke-width="0.7"/>
  <line x1="698" y1="319" x2="714" y2="319" stroke="#FF2E55" stroke-width="0.7"/>
  <line x1="754" y1="311" x2="754" y2="327" stroke="#FF2E55" stroke-width="0.7"/>
  <line x1="746" y1="319" x2="762" y2="319" stroke="#FF2E55" stroke-width="0.7"/>
  <text x="730" y="345" text-anchor="middle" fill="#FF2E55" class="m" font-size="9" font-weight="700">🔥 PYTORCH ARTILLERY</text>

  <!-- ⚛ REACT ORBITAL DRONE — upper-right, Y=130 -->
  <!-- Atom core -->
  <circle cx="750" cy="130" r="11" fill="#1e293b" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="750" cy="130" r="4" fill="#61DAFB" filter="url(#g)"/>
  <!-- Orbital electron rings (static ellipses, pulsing) -->
  <ellipse cx="750" cy="130" rx="32" ry="11" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.8" class="pls"/>
  <ellipse cx="750" cy="130" rx="32" ry="11" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.6" transform="rotate(60 750 130)"/>
  <ellipse cx="750" cy="130" rx="32" ry="11" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.5" transform="rotate(120 750 130)"/>
  <!-- Electron nodes -->
  <circle cx="782" cy="130" r="3" fill="#61DAFB" filter="url(#g)" class="pls"/>
  <circle cx="735" cy="115" r="3" fill="#61DAFB" filter="url(#g)" class="pls"/>
  <text x="750" y="158" text-anchor="middle" fill="#61DAFB" class="m" font-size="9" font-weight="700">⚛ REACT DRONE</text>


  <!-- ==================== CROSSFIRE: LASERS & PROJECTILES ==================== -->
  <!-- Rust Cannon → Center -->
  <line x1="140" y1="200" x2="440" y2="280" stroke="#00F0FF" stroke-width="3" class="laserL" filter="url(#g)"/>
  <!-- C++ Heavy Siege Blast → Center -->
  <line x1="165" y1="290" x2="445" y2="280" stroke="#38BDF8" stroke-width="4" class="laserH" filter="url(#g)"/>
  <!-- Go Blaster Volley → Center -->
  <line x1="275" y1="198" x2="450" y2="275" stroke="#22D3EE" stroke-width="2.5" class="laserL"/>
  <!-- TS Drone Precision Shot → Center -->
  <line x1="248" y1="132" x2="460" y2="270" stroke="#60A5FA" stroke-width="2" class="laserL" opacity="0.7"/>

  <!-- Python Dragon → Center -->
  <line x1="830" y1="200" x2="520" y2="280" stroke="#10B981" stroke-width="3" class="laserR" filter="url(#g)"/>
  <!-- JS Chaos Beam → Center -->
  <line x1="817" y1="305" x2="520" y2="285" stroke="#FACC15" stroke-width="3" class="laserR" filter="url(#g)"/>
  <!-- PyTorch Artillery Lightning Arc -->
  <path d="M672 238L630 245L580 270L540 260L510 280" fill="none" stroke="#FF2E55" stroke-width="3" class="zap" filter="url(#g)"/>
  <path d="M672 238L640 230L570 255L535 248L510 280" fill="none" stroke="#FF8800" stroke-width="2" class="zap"/>
  <!-- React Drone Energy → Center -->
  <line x1="718" y1="132" x2="510" y2="275" stroke="#61DAFB" stroke-width="2" class="laserR" opacity="0.6"/>


  <!-- ==================== GROUND ZERO EXPLOSION ==================== -->
  <!-- Shockwaves -->
  <circle cx="480" cy="280" r="10" stroke="#C084FC" fill="none" stroke-width="4" opacity="1">
    <animate attributeName="r" values="10;70" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="4;0.5" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="280" r="10" stroke="#FF5500" fill="none" stroke-width="3" opacity="1">
    <animate attributeName="r" values="10;70" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;0.5" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <!-- Core flash -->
  <circle cx="480" cy="280" r="16" fill="#FFF" filter="url(#bg2)" class="spk"/>
  <path d="M440 280L520 280M480 240L480 320" stroke="#FFF" stroke-width="3.5" filter="url(#bg2)" class="spk"/>
  <path d="M452 252L508 308M452 308L508 252" stroke="#FACC15" stroke-width="2.5" filter="url(#bg2)" class="spk"/>
  <text x="480" y="325" text-anchor="middle" fill="#FF3366" class="m" font-size="9.5" font-weight="bold">💥 COMPILE vs RUNTIME IMPACT 💥</text>


  <!-- ==================== BOTTOM COMMAND BANNER ==================== -->
  <rect x="110" y="385" width="740" height="28" rx="6" fill="#070b18" stroke="url(#stripe)" stroke-width="1.5"/>
  <text x="480" y="403" text-anchor="middle" class="m" font-size="10" font-weight="700">
    <tspan fill="#00F0FF">🛡 STATIC MEMORY SAFETY</tspan>
    <tspan fill="#FFF"> ──⚡ </tspan>
    <tspan fill="#C084FC">SIJAZ AHMED: HARMONIZING THE WAR</tspan>
    <tspan fill="#FFF"> ⚡── </tspan>
    <tspan fill="#FF3366">DYNAMIC AI VELOCITY 🚀</tspan>
  </text>
</svg>
