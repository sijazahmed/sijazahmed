<svg width="100%" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Cyber Battlefield -->
    <linearGradient id="warBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040610" />
      <stop offset="25%" stop-color="#070c20" />
      <stop offset="50%" stop-color="#0e0a1e" />
      <stop offset="75%" stop-color="#160a14" />
      <stop offset="100%" stop-color="#070308" />
    </linearGradient>

    <!-- Fog of War: Static Cyan vs Dynamic Crimson/Amber -->
    <radialGradient id="staticWarFog" cx="15%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="dynamicWarFog" cx="85%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FF2E55" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FF2E55" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="clashGroundZero" cx="50%" cy="58%" r="40%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#FF5500" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Top Laser Warning Bar -->
    <linearGradient id="warningBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FF2E55" />
    </linearGradient>

    <!-- Laser Beams Gradients -->
    <linearGradient id="cyanLaserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="amberLaserBeam" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2E55" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Tactical HUD Grid -->
    <pattern id="tacticalGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="15" cy="15" r="0.75" fill="#00F0FF" fill-opacity="0.15" />
    </pattern>

    <!-- Glow & Plasma Filters -->
    <filter id="warGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="impactFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="glow1" />
      <feGaussianBlur stdDeviation="2" result="glow2" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous High-Intensity Combat Animations */
    @keyframes laserPulseLeft {
      0% { stroke-dashoffset: 350; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes laserPulseRight {
      0% { stroke-dashoffset: -350; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes lightningFlicker {
      0%, 100% { opacity: 0.15; }
      18%, 22% { opacity: 0.95; }
      20% { opacity: 0.3; }
      68%, 72% { opacity: 1; filter: drop-shadow(0 0 8px #FF0055); }
      70% { opacity: 0.4; }
    }
    @keyframes shieldVibration {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      30% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 10px #00F0FF); }
      70% { transform: scale(0.98); opacity: 0.85; }
    }
    @keyframes shockwaveExpand {
      0% { r: 6; opacity: 1; stroke-width: 4; }
      50% { opacity: 0.8; stroke-width: 2.5; }
      100% { r: 70; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes sparkFlashes {
      0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      25% { opacity: 1; transform: scale(1.3) rotate(45deg); }
      50% { opacity: 0.4; transform: scale(0.9) rotate(90deg); }
      75% { opacity: 1; transform: scale(1.25) rotate(135deg); }
    }
    @keyframes missileFlight {
      0% { transform: translateX(0px); opacity: 0; }
      25% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(180px); opacity: 0; }
    }

    .laser-rapid-cyan {
      stroke-dasharray: 25 15;
      animation: laserPulseLeft 1.2s linear infinite;
    }
    .laser-rapid-amber {
      stroke-dasharray: 25 15;
      animation: laserPulseRight 1.1s linear infinite;
    }
    .laser-torpedo {
      stroke-dasharray: 60 40;
      animation: laserPulseLeft 0.8s linear infinite;
    }
    .lightning-path {
      animation: lightningFlicker 1.8s ease-in-out infinite;
    }
    .shield-pulse {
      animation: shieldVibration 2s ease-in-out infinite;
      transform-origin: 275px 180px;
    }
    .clash-shockwave {
      animation: shockwaveExpand 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    .clash-shockwave-delay {
      animation: shockwaveExpand 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 0.8s;
    }
    .sparks-core {
      animation: sparkFlashes 1.4s ease-in-out infinite;
      transform-origin: 480px 185px;
    }

    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#nameGradient);
    }
    .badge-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .mono-code {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
    }
  </style>

  <!-- Background Battlefield Layers -->
  <rect width="960" height="320" rx="16" fill="url(#warBg)" />
  <rect width="960" height="320" rx="16" fill="url(#tacticalGrid)" />
  <rect width="960" height="320" rx="16" fill="url(#staticWarFog)" />
  <rect width="960" height="320" rx="16" fill="url(#dynamicWarFog)" />
  <rect width="960" height="320" rx="16" fill="url(#clashGroundZero)" />

  <!-- Top Laser Warning Bar -->
  <rect x="0" y="0" width="960" height="3" fill="url(#warningBorder)" />

  <!-- Top Status Battle Ribbon -->
  <g transform="translate(480, 26)">
    <rect x="-260" y="-12" width="520" height="24" rx="12" fill="#080c1a" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="-235" cy="0" r="3.5" fill="#00F0FF" filter="url(#warGlow)" />
    <circle cx="235" cy="0" r="3.5" fill="#FF0055" filter="url(#warGlow)" />
    <text text-anchor="middle" y="4" fill="#FFFFFF" class="badge-font" font-size="11">
      <tspan fill="#00F0FF">⚔️ STATIC CITADEL</tspan>
      <tspan fill="#94A3B8">  [ACTIVE COMPILER WARFARE]  </tspan>
      <tspan fill="#FF3366">DYNAMIC SWARM 🔥</tspan>
    </text>
  </g>

  <!-- ================= LEFT BATTLE FLANK: THE STATIC CITADEL ================= -->
  <!-- Bunker 1: 🦀 RUST (Borrow Checker Heavy Battery) -->
  <g transform="translate(115, 90)">
    <path d="M -85 -16 L 60 -16 L 80 0 L 60 16 L -85 16 Z" fill="#091428" stroke="#00F0FF" stroke-width="1.8" />
    <circle cx="-65" cy="0" r="3" fill="#00F0FF" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="-50" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">🦀 RUST</text>
    <text x="3" y="4" fill="#00F0FF" class="mono-code" font-size="8.5">[LIFETIME]</text>
    <rect x="80" y="-3" width="14" height="6" fill="#00F0FF" filter="url(#warGlow)" />
  </g>

  <!-- Bunker 2: ⚔️ C++20 (Pointer Railgun) -->
  <g transform="translate(115, 150)">
    <path d="M -85 -16 L 60 -16 L 80 0 L 60 16 L -85 16 Z" fill="#091428" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="-65" cy="0" r="3" fill="#38BDF8" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <text x="-50" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">⚔️ C++20</text>
    <text x="3" y="4" fill="#38BDF8" class="mono-code" font-size="8.5">[*POINTER]</text>
    <rect x="80" y="-3" width="18" height="6" fill="#38BDF8" filter="url(#warGlow)" />
  </g>

  <!-- Bunker 3: ⚡ GO (Goroutine Concurrency Cannon) -->
  <g transform="translate(115, 210)">
    <path d="M -85 -16 L 60 -16 L 80 0 L 60 16 L -85 16 Z" fill="#091428" stroke="#22D3EE" stroke-width="1.8" />
    <circle cx="-65" cy="0" r="3" fill="#22D3EE" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="-50" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">⚡ GO</text>
    <text x="3" y="4" fill="#22D3EE" class="mono-code" font-size="8.5">[CHANNELS]</text>
    <rect x="80" y="-3" width="12" height="6" fill="#22D3EE" filter="url(#warGlow)" />
  </g>

  <!-- Bunker 4: 🔷 TYPESCRIPT (Strict Guard) -->
  <g transform="translate(115, 270)">
    <path d="M -85 -16 L 60 -16 L 80 0 L 60 16 L -85 16 Z" fill="#091428" stroke="#60A5FA" stroke-width="1.8" />
    <circle cx="-65" cy="0" r="3" fill="#60A5FA" filter="url(#warGlow)" />
    <text x="-50" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">🔷 TS</text>
    <text x="-15" y="4" fill="#60A5FA" class="mono-code" font-size="8.5">[STRICT-CHECK]</text>
    <rect x="80" y="-3" width="10" height="6" fill="#60A5FA" filter="url(#warGlow)" />
  </g>

  <!-- Forward Hexagonal Energy Shield (Protecting the Citadel) -->
  <g class="shield-pulse" transform="translate(255, 180)">
    <polygon points="0,-70 50,-35 50,35 0,70 -50,35 -50,-35" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 4" filter="url(#warGlow)" />
    <polygon points="0,-48 35,-24 35,24 0,48 -35,24 -35,-24" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.2" />
    <text x="-40" y="-76" fill="#00F0FF" class="mono-code" font-size="8" font-weight="700">&lt;&amp;mut BARRIER&gt;</text>
    <!-- Sparks on shield from incoming plasma -->
    <circle cx="50" cy="-15" r="3.5" fill="#FFFFFF" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="42" cy="22" r="4" fill="#FF5500" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.1s" repeatCount="indefinite" />
    </circle>
  </g>


  <!-- ================= RIGHT BATTLE FLANK: THE DYNAMIC SWARM ================= -->
  <!-- Battery 1: 🐍 PYTHON (Tensor Archmage Cannon) -->
  <g transform="translate(845, 90)">
    <path d="M 85 -16 L -60 -16 L -80 0 L -60 16 L 85 16 Z" fill="#200d14" stroke="#10B981" stroke-width="1.8" />
    <circle cx="65" cy="0" r="3" fill="#10B981" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="-52" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">🐍 PYTHON</text>
    <text x="14" y="4" fill="#10B981" class="mono-code" font-size="8.5">[AI/ML]</text>
    <rect x="-94" y="-3" width="14" height="6" fill="#10B981" filter="url(#warGlow)" />
  </g>

  <!-- Battery 2: ⚡ JAVASCRIPT (Event Loop Chaos Artillery) -->
  <g transform="translate(845, 150)">
    <path d="M 85 -16 L -60 -16 L -80 0 L -60 16 L 85 16 Z" fill="#200d14" stroke="#FACC15" stroke-width="1.8" />
    <circle cx="65" cy="0" r="3" fill="#FACC15" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="-52" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">⚡ JS/NODE</text>
    <text x="14" y="4" fill="#FACC15" class="mono-code" font-size="8.5">[ASYNC]</text>
    <rect x="-98" y="-3" width="18" height="6" fill="#FACC15" filter="url(#warGlow)" />
  </g>

  <!-- Battery 3: 🔥 PYTORCH (Neural CUDA Barrage) -->
  <g transform="translate(845, 210)">
    <path d="M 85 -16 L -60 -16 L -80 0 L -60 16 L 85 16 Z" fill="#200d14" stroke="#FF2E55" stroke-width="1.8" />
    <circle cx="65" cy="0" r="3" fill="#FF2E55" filter="url(#warGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <text x="-52" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">🔥 PYTORCH</text>
    <text x="14" y="4" fill="#FF2E55" class="mono-code" font-size="8.5">[CUDA]</text>
    <rect x="-94" y="-3" width="14" height="6" fill="#FF2E55" filter="url(#warGlow)" />
  </g>

  <!-- Battery 4: ⚛️ REACT (Virtual DOM Swarm) -->
  <g transform="translate(845, 270)">
    <path d="M 85 -16 L -60 -16 L -80 0 L -60 16 L 85 16 Z" fill="#200d14" stroke="#F59E0B" stroke-width="1.8" />
    <circle cx="65" cy="0" r="3" fill="#F59E0B" filter="url(#warGlow)" />
    <text x="-52" y="4" fill="#FFFFFF" class="mono-code" font-size="11" font-weight="700">⚛️ REACT</text>
    <text x="0" y="4" fill="#F59E0B" class="mono-code" font-size="8.5">[TURBO-UI]</text>
    <rect x="-94" y="-3" width="14" height="6" fill="#F59E0B" filter="url(#warGlow)" />
  </g>


  <!-- ================= ACTIVE COMBAT CROSSFIRE (LASERS & LIGHTNING) ================= -->
  <!-- Laser Bolt 1: C++ Pointer Harpoon streaking to Right -->
  <line x1="210" y1="150" x2="480" y2="185" stroke="url(#cyanLaserBeam)" stroke-width="3.5" class="laser-rapid-cyan" filter="url(#warGlow)" />
  
  <!-- Laser Bolt 2: Rust Zero-Cost Laser targeting Dynamic Lines -->
  <line x1="210" y1="90" x2="475" y2="175" stroke="#00F0FF" stroke-width="3" class="laser-torpedo" filter="url(#warGlow)" />

  <!-- Laser Bolt 3: Go Goroutine volley -->
  <line x1="205" y1="210" x2="480" y2="195" stroke="#22D3EE" stroke-width="2.5" class="laser-rapid-cyan" />

  <!-- Laser Bolt 4: Dynamic Amber/Crimson Plasma firing back to Left -->
  <line x1="750" y1="150" x2="480" y2="185" stroke="url(#amberLaserBeam)" stroke-width="3.5" class="laser-rapid-amber" filter="url(#warGlow)" />

  <!-- Laser Bolt 5: PyTorch Flame Missile -->
  <line x1="750" y1="210" x2="485" y2="195" stroke="#FF2E55" stroke-width="3" class="laser-rapid-amber" filter="url(#warGlow)" />

  <!-- Lightning Arc: Python PyTorch Tensor Lightning Crackling across the sky -->
  <path d="M 750 90 L 650 115 L 590 95 L 520 145 L 480 180" fill="none" stroke="#10B981" stroke-width="2.5" class="lightning-path" filter="url(#warGlow)" />
  <path d="M 750 90 L 660 80 L 570 120 L 510 110 L 480 180" fill="none" stroke="#FACC15" stroke-width="1.8" class="lightning-path" />


  <!-- ================= GROUND ZERO CLASH (CENTER COLLISION) ================= -->
  <g transform="translate(480, 185)">
    <!-- Expanding Plasma Shockwaves -->
    <circle cx="0" cy="0" class="clash-shockwave" stroke="#C084FC" fill="none" />
    <circle cx="0" cy="0" class="clash-shockwave-delay" stroke="#00F0FF" fill="none" />

    <!-- Exploding Spark Core Flare -->
    <g class="sparks-core">
      <path d="M -40 0 L 40 0 M 0 -40 L 0 40" stroke="#FFFFFF" stroke-width="3.5" filter="url(#impactFlare)" />
      <path d="M -26 -26 L 26 26 M -26 26 L 26 -26" stroke="#FACC15" stroke-width="2.5" filter="url(#impactFlare)" />
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" filter="url(#impactFlare)" />
    </g>

    <!-- Clash Zone Warning Text -->
    <text y="42" text-anchor="middle" fill="#FF3366" class="mono-code" font-size="9.5" font-weight="bold" letter-spacing="1">
      💥 COMPILE vs RUNTIME IMPACT 💥
    </text>
  </g>


  <!-- ================= CENTER HEADQUARTERS: SIJAZ AHMED ================= -->
  <g transform="translate(480, 75)" text-anchor="middle">
    <!-- Commander Badge -->
    <rect x="-210" y="-36" width="420" height="26" rx="13" fill="rgba(0, 240, 255, 0.1)" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="-19" class="badge-font" font-size="11.5" fill="#00F0FF">
      SENIOR AI/ML ARCHITECT • FULL STACK LEAD
    </text>

    <!-- Main Metallic Shimmer Name -->
    <text x="0" y="32" class="title-font" font-size="50">SIJAZ AHMED</text>

    <!-- Subtitle Spec -->
    <text x="0" y="60" class="mono-code" font-size="10.5" fill="#94A3B8" letter-spacing="1">
      ENTERPRISE LLMs &amp; RAG  •  REAL-TIME EVENT STREAMING  •  MULTI-CLOUD
    </text>
  </g>


  <!-- ================= BOTTOM ARCHITECT'S COMMAND NEXUS ================= -->
  <g transform="translate(480, 290)">
    <rect x="-350" y="-15" width="700" height="30" rx="6" fill="#070b18" stroke="url(#warningBorder)" stroke-width="1.5" />
    <text text-anchor="middle" y="5" class="mono-code" font-size="10.5" font-weight="700">
      <tspan fill="#00F0FF">🛡️ STATIC MEMORY SAFETY</tspan>
      <tspan fill="#FFFFFF"> ──⚡ </tspan>
      <tspan fill="#C084FC">SIJAZ AHMED: HARMONIZING THE WAR</tspan>
      <tspan fill="#FFFFFF"> ⚡── </tspan>
      <tspan fill="#FF3366">DYNAMIC AI VELOCITY 🚀</tspan>
    </text>
  </g>
</svg>
