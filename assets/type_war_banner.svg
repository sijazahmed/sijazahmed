<svg width="100%" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="twBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <!-- Faction Glows -->
    <radialGradient id="staticGlow" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dynamicGlow" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="centerClashGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradients -->
    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Beam Gradients -->
    <linearGradient id="staticBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="dynamicBeam" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="15" cy="15" r="0.75" fill="#00f0ff" fill-opacity="0.15" />
    </pattern>

    <!-- Neon Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatLeft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatRight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes pulseClash {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes laserPulse {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
      50% { stroke-dashoffset: 40; opacity: 1; }
    }
    @keyframes driftToken {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-30px) translateX(10px); opacity: 0; }
    }

    .float-l1 { animation: floatLeft 3s ease-in-out infinite; }
    .float-l2 { animation: floatLeft 3.6s ease-in-out infinite 0.5s; }
    .float-r1 { animation: floatRight 3.2s ease-in-out infinite; }
    .float-r2 { animation: floatRight 3.8s ease-in-out infinite 0.4s; }
    .clash-pulse { animation: pulseClash 2s ease-in-out infinite; transform-origin: 450px 145px; }
    .laser-line { stroke-dasharray: 8 4; animation: laserPulse 1.2s linear infinite; }
    
    .token-1 { animation: driftToken 4s linear infinite; }
    .token-2 { animation: driftToken 5s linear infinite 1.5s; }
    .token-3 { animation: driftToken 4.5s linear infinite 0.8s; }
    .token-4 { animation: driftToken 5.2s linear infinite 2.2s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 3px;
    }
    .mono-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
    }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="280" rx="14" fill="url(#twBgGrad)" />
  <rect width="900" height="280" rx="14" fill="url(#gridPat)" />
  <rect width="900" height="280" rx="14" fill="url(#staticGlow)" />
  <rect width="900" height="280" rx="14" fill="url(#dynamicGlow)" />
  <rect width="900" height="280" rx="14" fill="url(#centerClashGlow)" />

  <!-- Outer Neon Border -->
  <rect x="1" y="1" width="898" height="278" rx="13" fill="none" stroke="url(#topBorder)" stroke-width="2" />

  <!-- Top Title Ribbon -->
  <g transform="translate(450, 36)">
    <!-- Pill Background -->
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#0c1222" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="-215" cy="0" r="4" fill="#00f0ff" filter="url(#glowFilter)" />
    <circle cx="215" cy="0" r="4" fill="#f59e0b" filter="url(#glowFilter)" />
    <text text-anchor="middle" y="5" fill="#ffffff" class="title-text" font-size="13">
      <tspan fill="#00f0ff">STATIC CITADEL</tspan>
      <tspan fill="#64748b"> vs </tspan>
      <tspan fill="#f59e0b">DYNAMIC SWARM</tspan>
      <tspan fill="#c084fc"> // THE GREAT TYPE WAR</tspan>
    </text>
  </g>

  <!-- Floating Syntax Tokens (Ambient Code Matrix) -->
  <text x="140" y="80" fill="#00f0ff" font-size="11" class="mono-text token-1">&amp;mut world</text>
  <text x="260" y="240" fill="#38bdf8" font-size="10" class="mono-text token-2">0x7FFE20 &lt;ptr&gt;</text>
  <text x="660" y="85" fill="#f59e0b" font-size="11" class="mono-text token-3">[object Object]</text>
  <text x="740" y="235" fill="#10b981" font-size="10" class="mono-text token-4">import antigravity</text>

  <!-- ================= LEFT: STATIC CITADEL ================= -->
  <!-- 🦀 Rust (Paladin) -->
  <g class="float-l1" transform="translate(130, 140)">
    <!-- Hexagonal Shield -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-width="2" filter="url(#glowFilter)" />
    <!-- Crab Mech Shell -->
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#0f172a" stroke="#ff5722" stroke-width="2.5" />
    <circle cx="-6" cy="-4" r="2.5" fill="#00f0ff" />
    <circle cx="6" cy="-4" r="2.5" fill="#00f0ff" />
    <path d="M -16 -4 Q -26 -14 -18 -20 Q -10 -16 -12 -8" fill="none" stroke="#ff5722" stroke-width="2" />
    <path d="M 16 -4 Q 26 -14 18 -20 Q 10 -16 12 -8" fill="none" stroke="#ff5722" stroke-width="2" />
    <text text-anchor="middle" y="48" fill="#ffffff" font-size="11" font-weight="700" class="title-text">🦀 Rust</text>
    <text text-anchor="middle" y="59" fill="#00f0ff" font-size="8" class="mono-text">Borrow Checker</text>
  </g>

  <!-- ⚔️ C++ (Dreadnought) -->
  <g class="float-l2" transform="translate(230, 175)">
    <rect x="-20" y="-16" width="40" height="32" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowFilter)" />
    <rect x="18" y="-10" width="12" height="5" fill="#64748b" />
    <rect x="18" y="5" width="12" height="5" fill="#64748b" />
    <text text-anchor="middle" y="4" fill="#38bdf8" font-size="10" font-weight="800" class="mono-text">*ptr</text>
    <text text-anchor="middle" y="42" fill="#ffffff" font-size="11" font-weight="700" class="title-text">⚔️ C++</text>
    <text text-anchor="middle" y="52" fill="#38bdf8" font-size="8" class="mono-text">Segfault Harpoon</text>
  </g>

  <!-- ⚡ Go (Commander) -->
  <g class="float-l1" transform="translate(215, 95)">
    <circle cx="0" cy="0" r="17" fill="#0891b2" stroke="#22d3ee" stroke-width="2" filter="url(#glowFilter)" />
    <circle cx="-5" cy="-3" r="5" fill="#ffffff" />
    <circle cx="5" cy="-3" r="5" fill="#ffffff" />
    <circle cx="-4" cy="-3" r="2.5" fill="#0f172a" />
    <circle cx="6" cy="-3" r="2.5" fill="#0f172a" />
    <text text-anchor="middle" y="-23" fill="#ffffff" font-size="11" font-weight="700" class="title-text">⚡ Go</text>
    <text text-anchor="middle" y="-13" fill="#22d3ee" font-size="8" class="mono-text">Goroutine Swarm</text>
  </g>

  <!-- 🔷 TypeScript (Ronin) -->
  <g class="float-l2" transform="translate(310, 140)">
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" filter="url(#glowFilter)" />
    <text text-anchor="middle" y="4" fill="#ffffff" font-size="10" font-weight="800" class="mono-text">TS</text>
    <text text-anchor="middle" y="32" fill="#ffffff" font-size="10" font-weight="700" class="title-text">🔷 TS</text>
  </g>

  <!-- ================= CENTER: THE CLASH & SYNTHESIS ================= -->
  <!-- Firing Laser Beams Clashing in Center -->
  <path d="M 160 140 L 430 145" stroke="url(#staticBeam)" stroke-width="3" class="laser-line" />
  <path d="M 255 175 L 435 150" stroke="#38bdf8" stroke-width="2.5" class="laser-line" />
  <path d="M 740 140 L 470 145" stroke="url(#dynamicBeam)" stroke-width="3" class="laser-line" />
  <path d="M 670 175 L 465 150" stroke="#f59e0b" stroke-width="2.5" class="laser-line" />

  <!-- Central Clash Orb & Energy Shockwave -->
  <g class="clash-pulse">
    <circle cx="450" cy="145" r="28" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="450" cy="145" r="16" fill="rgba(250, 204, 21, 0.25)" stroke="#facc15" stroke-width="2" filter="url(#glowFilter)" />
    <!-- Cross Spark Flares -->
    <path d="M 450 115 L 450 175 M 420 145 L 480 145" stroke="#ffffff" stroke-width="2" />
    <path d="M 430 125 L 470 165 M 430 165 L 470 125" stroke="#facc15" stroke-width="1" />
  </g>

  <!-- ================= RIGHT: DYNAMIC SWARM ================= -->
  <!-- 🐍 Python (Serpent Archmage) -->
  <g class="float-r1" transform="translate(770, 140)">
    <circle cx="0" cy="0" r="24" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#glowFilter)" />
    <!-- Serpent Dual Coil -->
    <path d="M -12 6 Q 0 -14 12 6" fill="none" stroke="#fbbf24" stroke-width="3" />
    <circle cx="-5" cy="-2" r="2.5" fill="#fbbf24" />
    <circle cx="5" cy="-2" r="2.5" fill="#10b981" />
    <!-- Floating Tensor Nodes -->
    <circle cx="-24" cy="-14" r="3.5" fill="#ee4c2c" />
    <circle cx="24" cy="-14" r="3.5" fill="#ee4c2c" />
    <circle cx="0" cy="25" r="3.5" fill="#ee4c2c" />
    <text text-anchor="middle" y="48" fill="#ffffff" font-size="11" font-weight="700" class="title-text">🐍 Python</text>
    <text text-anchor="middle" y="59" fill="#10b981" font-size="8" class="mono-text">PyTorch Lightning</text>
  </g>

  <!-- ⚡ JavaScript (Event Loop Jester) -->
  <g class="float-r2" transform="translate(670, 175)">
    <!-- Event loop ring -->
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#854d0e" stroke="#facc15" stroke-width="2.5" filter="url(#glowFilter)" />
    <text text-anchor="middle" y="4" fill="#facc15" font-size="11" font-weight="900" class="mono-text">JS</text>
    <text text-anchor="middle" y="42" fill="#ffffff" font-size="11" font-weight="700" class="title-text">⚡ JS</text>
    <text text-anchor="middle" y="52" fill="#facc15" font-size="8" class="mono-text">Event Loop Chaos</text>
  </g>

  <!-- 💎 Ruby (Rogue) -->
  <g class="float-r1" transform="translate(685, 95)">
    <polygon points="-14,-8 14,-8 18,0 0,16 -18,0" fill="#881337" stroke="#f43f5e" stroke-width="2" filter="url(#glowFilter)" />
    <text text-anchor="middle" y="-23" fill="#ffffff" font-size="11" font-weight="700" class="title-text">💎 Ruby</text>
    <text text-anchor="middle" y="-13" fill="#f43f5e" font-size="8" class="mono-text">Monkey-Patching</text>
  </g>

  <!-- 🐘 PHP (ElePHPant Ram) -->
  <g class="float-r2" transform="translate(590, 140)">
    <ellipse cx="0" cy="0" rx="18" ry="15" fill="#312e81" stroke="#818cf8" stroke-width="2" filter="url(#glowFilter)" />
    <text text-anchor="middle" y="4" fill="#ffffff" font-size="8" font-weight="800" class="mono-text">PHP</text>
    <text text-anchor="middle" y="32" fill="#ffffff" font-size="10" font-weight="700" class="title-text">🐘 PHP</text>
  </g>

  <!-- ================= BOTTOM BANNER: SIJAZ AHMED SYNTHESIS ================= -->
  <g transform="translate(450, 246)">
    <rect x="-380" y="-18" width="760" height="36" rx="10" fill="#080e1c" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
    <text text-anchor="middle" y="5" fill="#ffffff" class="title-text" font-size="11">
      <tspan fill="#c084fc">🏛️ ARCHITECT'S SYNTHESIS:</tspan>
      <tspan fill="#e2e8f0"> Sijaz Ahmed unifies Python AI &amp; TypeScript Web with Rust/C++ High-Throughput Pipelines</tspan>
    </text>
  </g>
</svg>
